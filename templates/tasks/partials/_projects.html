<section id="sharedProjects" class="card border-0 shadow-sm mt-4 p-3" data-current-user="{{ request.user.id }}" aria-labelledby="sharedProjectsTitle">
  <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
    <div>
      <div class="eyebrow">Shared delivery</div>
      <h2 id="sharedProjectsTitle" class="h4 mb-1">Projects</h2>
      <p class="text-muted mb-0">Create and assign a project. Its project-name card is added to this Kanban automatically.</p>
    </div>
    <button id="toggleProjectForm" class="btn-uj" type="button" data-bs-toggle="collapse" data-bs-target="#projectFormPanel" aria-expanded="false" aria-controls="projectFormPanel">
      <i class="bi bi-plus-lg"></i> New project
    </button>
  </header>

  <div class="collapse mb-4" id="projectFormPanel">
    <form id="projectForm" class="border rounded-3 bg-light p-3">
      <div class="row g-3">
        <div class="col-lg-6">
          <label class="form-label" for="projectName">Project name</label>
          <input class="form-control" id="projectName" maxlength="255" required>
        </div>
        <div class="col-lg-3">
          <label class="form-label" for="projectDueDate">Due date <span class="text-muted">(optional)</span></label>
          <input class="form-control" id="projectDueDate" type="date">
        </div>
        <div class="col-lg-3">
          <label class="form-label" for="projectAssignees">Assign employees</label>
          <select class="form-select" id="projectAssignees" multiple required size="4">
            {% for employee in assignees %}
              <option value="{{ employee.id }}">{{ employee.get_full_name|default:employee.username }} — {{ employee.get_role_display }}</option>
            {% endfor %}
          </select>
          <small class="text-muted">Use Ctrl/Cmd to select more than one.</small>
        </div>
        <div class="col-lg-6">
          <label class="form-label" for="projectDescription">Description <span class="text-muted">(optional)</span></label>
          <textarea class="form-control" id="projectDescription" rows="4"></textarea>
        </div>
        <div class="col-lg-6">
          <label class="form-label" for="projectSubtasks">Subtasks <span class="text-muted">(optional)</span></label>
          <textarea class="form-control" id="projectSubtasks" rows="4" placeholder="One subtask per line"></textarea>
        </div>
      </div>
      <div class="d-flex justify-content-end mt-3">
        <button id="createProjectButton" class="btn-uj" type="submit">Create and assign project</button>
      </div>
    </form>
  </div>

  <div class="table-responsive">
    <table class="table module-table align-middle mb-0">
      <thead><tr><th>Project</th><th>Kanban status</th><th>Assigned to</th><th>Due date</th><th class="text-end">Subtasks</th></tr></thead>
      <tbody id="projectsTableBody">
        <tr><td colspan="5" class="text-muted text-center py-4">Select a board to view its projects.</td></tr>
      </tbody>
    </table>
  </div>
</section>
