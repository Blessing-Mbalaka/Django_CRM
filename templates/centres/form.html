{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ action }} Department{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-8 col-lg-6">
    <div class="uj-card">
      <div class="uj-card-header">
        <span><i class="bi bi-building me-2 text-uj"></i>{{ action }} Department</span>
        {% if object %}
        <a href="{% url 'centres:detail' object.pk %}" class="btn-uj-outline" style="font-size:0.75rem;">Cancel</a>
        {% else %}
        <a href="{% url 'centres:list' %}" class="btn-uj-outline" style="font-size:0.75rem;">Cancel</a>
        {% endif %}
      </div>
      <div class="uj-card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-flex justify-content-end mt-3">
            <button type="submit" class="btn-uj">
              <i class="bi bi-check-lg me-1"></i>{{ action }} Department
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
