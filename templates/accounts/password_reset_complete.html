{% extends "base.html" %}
{% load static %}
{% block title %}Password Reset Complete{% endblock %}

{% block auth_content %}
<div class="login-wrapper">
  <div class="login-card text-center">
    <img src="{% static 'images/uj_logo.png' %}" alt="University of Johannesburg" class="login-logo" width="80" height="80" />
    <span class="fs-1 text-success d-block mb-2"><i class="bi bi-shield-check-fill"></i></span>
    <h1 class="login-title">Password Updated</h1>
    <p class="login-subtitle">Your password has been set. You can now sign in.</p>
    <a href="{% url 'accounts:login' %}" class="btn-uj w-100 mt-3">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
    </a>
  </div>
</div>
{% endblock %}
