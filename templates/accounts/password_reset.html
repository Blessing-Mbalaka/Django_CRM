{% extends "base.html" %}
{% load static %}
{% block title %}Reset Password{% endblock %}

{% block auth_content %}
<div class="login-wrapper">
  <div class="login-card">
    <img src="{% static 'images/uj_logo.png' %}" alt="University of Johannesburg" class="login-logo" width="80" height="80" />
    <h1 class="login-title">Reset Password</h1>
    <p class="login-subtitle">Enter your email address and we'll send you a reset link.</p>

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-4">
        <label for="id_email" class="form-label">Email Address</label>
        <input type="email" name="email" id="id_email" class="form-control" placeholder="you@uj.ac.za" required autofocus>
      </div>
      <button type="submit" class="btn-uj w-100">
        <i class="bi bi-envelope me-2"></i>Send Reset Link
      </button>
    </form>

    <p class="text-center mt-3 mb-0" style="font-size:0.82rem;">
      <a href="{% url 'accounts:login' %}">Back to Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
